<div class="modal-backdrop" id="modal-add-mapping" style="display: none;">
    <div class="modal-card">
        <div class="modal-header">
            <h2>Assign Teacher to Subject</h2>
            <button class="modal-close" onclick="closeModal('modal-add-mapping')">&times;</button>
        </div>
        <form id="form-add-mapping">
            <div class="form-group"><label>Teacher</label><select id="map-teacher-select" required></select></div>
            <div class="form-group"><label>Subject</label><select id="map-subject-select" required></select></div>
            <div class="form-group"><label>Section (Optional)</label><select id="map-section-select"></select></div>
            <div class="form-group"><label>Academic Year</label><input type="text" id="map-year" value="2026-2027"></div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Mapping</button>
        </form>
    </div>
</div>
