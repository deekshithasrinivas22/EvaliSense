<div class="modal-backdrop" id="modal-add-question" style="display: none;">
    <div class="modal-card" style="max-width: 650px;">
        <div class="modal-header">
            <h2>Add Question & Rubric</h2>
            <button class="modal-close" onclick="closeModal('modal-add-question')">&times;</button>
        </div>
        <form id="form-add-question">
            <input type="hidden" id="q-exam-id">
            <div class="form-group"><label>Question Number</label><input type="number" id="q-number" required value="1" min="1"></div>
            <div class="form-group"><label>Question Text</label><textarea id="q-text" rows="2" required placeholder="State and explain Newton's second law of motion."></textarea></div>
            <div class="form-group"><label>Max Marks</label><input type="number" id="q-marks" required value="5.0" step="0.5"></div>
            <div class="form-group"><label>Reference Answer / Key</label><textarea id="q-ref" rows="3" placeholder="Expected student answer"></textarea></div>
            <div class="form-group">
                <label>Rubric JSON (Criteria with Marks and Keywords)</label>
                <textarea id="q-rubric" rows="6" placeholder='{"question": "...", "max_marks": 5.0, "criteria": [{"id": "c1", "description": "...", "marks": 2.5, "keywords": ["..."]}]}'></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Question & Rubric</button>
        </form>
    </div>
</div>
