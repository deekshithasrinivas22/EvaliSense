<div class="modal-backdrop" id="modal-add-section" style="display: none;">
    <div class="modal-card">
        <div class="modal-header">
            <h2>Add Section / Class</h2>
            <button class="modal-close" onclick="closeModal('modal-add-section')">&times;</button>
        </div>
        <form id="form-add-section">
            <div class="form-group"><label>Department</label><select id="sec-dept-select" required></select></div>
            <div class="form-group"><label>Section Name</label><input type="text" id="sec-name" required placeholder="e.g. CSE-B"></div>
            <div class="form-group"><label>Semester</label><input type="number" id="sec-sem" min="1" max="10" required value="5"></div>
            <div class="form-group"><label>Academic Year</label><input type="text" id="sec-year" required value="2026-2027"></div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Section</button>
        </form>
    </div>
</div>
