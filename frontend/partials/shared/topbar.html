<header class="topbar">
    <div class="topbar-left">
        <h3 id="topbar-user-greeting" style="font-size: 1.05rem; margin: 0;">Welcome to EvaliSense</h3>
        <span id="topbar-role-badge" class="topbar-role-badge role-badge-guest">Guest</span>
    </div>
    <div class="topbar-right">
        <button class="notif-btn" id="btn-toggle-notifs" title="Notifications">
            🔔 <span class="notif-badge" id="notif-count-badge" style="display: none;">0</span>
        </button>
        <button class="btn btn-primary" id="btn-login-open" style="font-size: 0.85rem; padding: 0.45rem 1rem;">Sign In</button>
        <button class="btn btn-secondary" id="btn-logout" style="display: none; font-size: 0.85rem; padding: 0.45rem 1rem;">Logout</button>
    </div>
</header>
