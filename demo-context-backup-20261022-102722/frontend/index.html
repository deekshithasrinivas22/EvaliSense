    <script>
        // Prevent ReferenceError for onclick handlers while external scripts load
        if (typeof quickLogin === 'undefined') {
            window.quickLogin = async function(u, p) {
                // Wait for app.js to define the real quickLogin, then call it
                if (window._realQuickLogin) {
                    return window._realQuickLogin(u, p);
                }
                // If app.js loaded but quickLogin wasn't bound yet, retry after a short delay
                await new Promise(r => setTimeout(r, 500));
                if (typeof login === 'function') {
                    return login(u, p);
                }
                alert('Application is still loading, please try again in a moment.');
            };
        }
        if (typeof closeModal === 'undefined') {
            window.closeModal = function(id) {
                var el = document.getElementById(id);
                if (el) el.style.display = 'none';
            };
        }
    </script>
